---
name: PyPI Publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # G7 / #222: removed the duplicate `test` job. main.yml runs lint + pytest on
  # every tag push (via `push.tags: ["v*"]`), so the tag-pushed `release:
  # published` trigger here arrives after main.yml has already verified the
  # commit. Releasing without re-running the same checks avoids ~3-4 minutes
  # of duplicate CI per release and keeps lint coverage (incl. yamllint) on
  # the main.yml SSoT instead of partial copies here.
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up uv environment"
        uses: "./.github/actions/setup-uv-env"
        with:
          python-version: "3.13"
          activate-environment: "false"
      - name: "Build package"
        run: "uv build"
      - name: "Verify bundled moduli is present in artifacts (issue #189)"
        run: |
          verify_moduli() {
            local label="$1"
            shift
            echo "::group::${label} contents"
            if ! "$@" | grep -E 'simnos/plugins/servers/moduli$'; then
              echo "::error::Bundled moduli file missing from ${label} — packaging regression detected"
              "$@"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          }
          verify_moduli "wheel" unzip -l dist/simnos-*.whl
          verify_moduli "sdist" tar tzf dist/simnos-*.tar.gz
      - name: "Upload distributions"
        uses: "actions/upload-artifact@v7"
        with:
          name: "dist"
          path: "dist/"

  publish:
    runs-on: "ubuntu-latest"
    needs:
      - "build"
    environment:
      name: "release"
      url: "https://pypi.org/p/simnos"
    permissions:
      id-token: write
    steps:
      - name: "Download distributions"
        uses: "actions/download-artifact@v8"
        with:
          name: "dist"
          path: "dist/"
      - name: "Publish to PyPI"
        uses: "pypa/gh-action-pypi-publish@release/v1"
