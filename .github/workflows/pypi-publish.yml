---
name: PyPI Publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          activate-environment: true
          enable-cache: true
          python-version: "3.13"
      - name: "Linting: ruff"
        run: "uv run invoke ruff"
      - name: "Security: bandit"
        run: "uv run invoke bandit"
      - name: "Run Tests"
        run: "uv run pytest -n auto"

  build:
    runs-on: "ubuntu-latest"
    needs:
      - "test"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          enable-cache: true
          python-version: "3.13"
      - name: "Build package"
        run: "uv build"
      - name: "Verify bundled moduli is present in artifacts (issue #189)"
        run: |
          echo "::group::wheel contents"
          unzip -l dist/simnos-*.whl | grep -E 'simnos/plugins/servers/moduli$' || {
            echo "::error::Bundled moduli file missing from wheel — packaging regression detected"
            unzip -l dist/simnos-*.whl
            exit 1
          }
          echo "::endgroup::"
          echo "::group::sdist contents"
          tar tzf dist/simnos-*.tar.gz | grep -E 'simnos/plugins/servers/moduli$' || {
            echo "::error::Bundled moduli file missing from sdist — packaging regression detected"
            tar tzf dist/simnos-*.tar.gz
            exit 1
          }
          echo "::endgroup::"
      - name: "Upload distributions"
        uses: "actions/upload-artifact@v7"
        with:
          name: "dist"
          path: "dist/"

  publish:
    runs-on: "ubuntu-latest"
    needs:
      - "build"
    environment:
      name: "release"
      url: "https://pypi.org/p/simnos"
    permissions:
      id-token: write
    steps:
      - name: "Download distributions"
        uses: "actions/download-artifact@v8"
        with:
          name: "dist"
          path: "dist/"
      - name: "Publish to PyPI"
        uses: "pypa/gh-action-pypi-publish@release/v1"
