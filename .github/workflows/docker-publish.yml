---
name: Docker Publish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  # Trivy SARIF upload to GitHub Code Scanning (Security tab).
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  # G7 / #222: removed the duplicate `test` job. main.yml runs lint + pytest on
  # every tag push, so by the time `release: published` fires here the commit
  # is already verified. Keeps the lint/test SSoT on main.yml and saves CI
  # minutes per release.
  scan:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Lowercase image name"
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Build image for scanning"
        uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "./docker/Dockerfile"
          push: false
          load: true
          platforms: "linux/amd64"
          tags: "${{ env.IMAGE_NAME }}:scan"
          cache-from: "type=gha,scope=docker-scan"
          cache-to: "type=gha,mode=max,scope=docker-scan"
      - name: "Trivy vulnerability scan (table, fail on CRITICAL/HIGH)"
        uses: "aquasecurity/trivy-action@v0.36.0"
        with:
          image-ref: "${{ env.IMAGE_NAME }}:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: "Trivy vulnerability scan (SARIF for Code Scanning)"
        if: always()
        continue-on-error: true
        uses: "aquasecurity/trivy-action@v0.36.0"
        with:
          image-ref: "${{ env.IMAGE_NAME }}:scan"
          format: "sarif"
          output: "trivy-results.sarif"
      - name: "Upload Trivy SARIF to GitHub Code Scanning"
        # SARIF upload is a security observability channel, not a release gate.
        # `continue-on-error: true` keeps a transient Code Scanning outage from
        # failing the scan job (which would block `publish` via `needs: scan`).
        if: always()
        continue-on-error: true
        uses: "github/codeql-action/upload-sarif@v4"
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-docker"

  publish:
    runs-on: "ubuntu-latest"
    needs:
      - "scan"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
        with:
          # metadata-action@v6 needs full history + tags so semver pattern
          # extraction works on workflow_dispatch / manual re-runs (release
          # published trigger alone is fine, but this guards against drift).
          fetch-depth: 0
          fetch-tags: true
      - name: "Lowercase image name"
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v4"
      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to GHCR"
        uses: "docker/login-action@v4"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Extract metadata"
        id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: "Build and push"
        uses: "docker/build-push-action@v7"
        with:
          context: "."
          file: "./docker/Dockerfile"
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: |
            type=gha,scope=docker-scan
            type=gha,scope=docker-publish
          cache-to: "type=gha,mode=max,scope=docker-publish"
