---
name: SIMNOS Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request: ~
  # Weekly nightly to catch Win/macOS regressions before a tag is cut.
  # Issue #189 (moduli) was an example of a Win/macOS-only failure that
  # surfaced only at release time without scheduled coverage.
  schedule:
    - cron: "0 0 * * 1"  # every Monday 00:00 UTC
  workflow_dispatch: ~

env:
  IMAGE_NAME: "simnos"

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up uv environment"
        uses: "./.github/actions/setup-uv-env"
      - name: "Linting: ruff"
        run: "uv run invoke ruff"
      - name: "Linting: yamllint"
        run: "uv run invoke yamllint"
      - name: "Security: bandit"
        run: "uv run invoke bandit"
      # Typecheck: ty is blocking since Phase 2 (#218).
      # Production code (simnos/) is ty-clean; tests/ excluded via
      # pyproject.toml [tool.ty.src]. New type errors in production fail CI.
      # GitHub Actions annotation format surfaces error locations directly in
      # PR review's "Files changed" tab.
      - name: "Typecheck: ty"
        run: "uv run ty check . --output-format=github"

  pytest:
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up uv environment"
        uses: "./.github/actions/setup-uv-env"
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Run Tests"
        run: "uv run pytest -n auto"
    needs:
      - "lint"

  pytest-full-matrix:
    # Triggered automatically on tag push (release flow), weekly via schedule
    # (Monday nightly), and manually via `gh workflow run` / GitHub UI for
    # pre-release verification.
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["macos-latest", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up uv environment"
        uses: "./.github/actions/setup-uv-env"
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Run Tests"
        run: "uv run pytest -n auto"
    needs:
      - "lint"

  build:
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: "ubuntu-latest"
    env:
      PYTHON_VER: ${{ matrix.python-version }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up uv environment"
        uses: "./.github/actions/setup-uv-env"
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "false"
      - name: "Get image version"
        run: "echo IMAGE_VER=$(python -c \"import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])\")-py${{ matrix.python-version }} >> $GITHUB_ENV"
      - name: "Setup Docker Buildx"
        id: "buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Build"
        uses: "docker/build-push-action@v7"
        with:
          builder: "${{ steps.buildx.outputs.name }}"
          context: "."
          push: false
          tags: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_VER }}"
          file: "./docker/Dockerfile"
          cache-from: "type=gha,scope=${{ env.IMAGE_NAME }}-py${{ matrix.python-version }}"
          cache-to: "type=gha,scope=${{ env.IMAGE_NAME }}-py${{ matrix.python-version }}"
          build-args: |
            PYTHON_VER=${{ env.PYTHON_VER }}
    needs:
      - "pytest"
