---
name: SIMNOS Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request: ~
  workflow_dispatch: ~

env:
  IMAGE_NAME: "simnos"

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          activate-environment: true
          enable-cache: true
      - name: "Linting: ruff"
        run: "uv run invoke ruff"
      - name: "Linting: yamllint"
        run: "uv run invoke yamllint"
      - name: "Security: bandit"
        run: "uv run invoke bandit"
      # Typecheck: ty is Phase 1 non-blocking (#216).
      # First step prints "Found N diagnostics" to CI log for count trending;
      # second step emits GitHub Actions annotations to PR review.
      # Both wrapped with continue-on-error to avoid blocking the workflow
      # while ~156 diagnostics still exist. Phase 2 will fix them and flip
      # this to blocking by removing both --no-exit-zero and continue-on-error.
      - name: "Typecheck: ty - count trend (Phase 1 non-blocking)"
        continue-on-error: true
        run: "uv run invoke ty --no-exit-zero"
      - name: "Typecheck: ty - PR annotations (Phase 1 non-blocking)"
        continue-on-error: true
        run: "uv run ty check . --output-format=github"

  pytest:
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: "Run Tests"
        run: "uv run pytest -n auto"
    needs:
      - "lint"

  pytest-full-matrix:
    # Triggered automatically on tag push (release flow) and manually via
    # `gh workflow run` / GitHub UI for pre-release verification (e.g.
    # confirming Win/macOS connectivity on `main` before cutting a tag).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
        os: ["macos-latest", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          activate-environment: true
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: "Run Tests"
        run: "uv run pytest -n auto"
    needs:
      - "lint"

  build:
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: "ubuntu-latest"
    env:
      PYTHON_VER: ${{ matrix.python-version }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: "Get image version"
        run: "echo IMAGE_VER=$(python -c \"import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])\")-py${{ matrix.python-version }} >> $GITHUB_ENV"
      - name: "Setup Docker Buildx"
        id: "buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Build"
        uses: "docker/build-push-action@v7"
        with:
          builder: "${{ steps.buildx.outputs.name }}"
          context: "."
          push: false
          tags: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_VER }}"
          file: "./docker/Dockerfile"
          cache-from: "type=gha,scope=${{ env.IMAGE_NAME }}-py${{ matrix.python-version }}"
          cache-to: "type=gha,scope=${{ env.IMAGE_NAME }}-py${{ matrix.python-version }}"
          build-args: |
            PYTHON_VER=${{ env.PYTHON_VER }}
    needs:
      - "pytest"
