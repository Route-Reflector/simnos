# to run pre-commit on demand using below configuration:
# pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  # ruff (replaces black, flake8, pylint)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # bandit security checks
  - repo: local
    hooks:
      - id: bandit
        name: bandit
        language: system
        entry: bandit
        args: ["-c", "pyproject.toml", "--recursive", "."]
  # A3 platform data conventions lint (#264 / D8, D9)
  - repo: local
    hooks:
      - id: lint-platform-data
        name: lint-platform-data
        language: system
        entry: invoke lint-platform-data
        # Fires on A3 data changes AND on edits to the lint logic / its
        # self-test, so touching the lint itself gets local feedback
        # instead of waiting for CI (code 2nd round 🦊#4).
        files: ^(simnos/plugins/nos/platforms/.*|tasks\.py|a3_paths\.py|tests/test_lint_platform_data\.py)$
        pass_filenames: false
