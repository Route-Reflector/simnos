[project]
name = "simnos"
version = "2.4.0"
description = "Simulated Network Operating System"
authors = [
    { name = "KeroRoute lab" },
]
maintainers = [
    { name = "KeroRoute lab" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = [
    "NetworkAutomation",
    "Testing",
    "SSH",
    "Integration",
    "NOS"
]
classifiers = [
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "paramiko>=4.0,<6.0",
    "asyncssh>=2.23,<3.0",
    "pyyaml<7.0",
    "pydantic<3.0",
    "jinja2>=3.1.6",
]


[project.urls]
Homepage = "https://github.com/Route-Reflector/simnos/"
Documentation = "https://route-reflector.github.io/simnos/"

[project.scripts]
simnos = "simnos.plugins.utils.cli:run_cli"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["venv", ".venv", "env", ".env"]

[tool.ruff.lint]
select = [
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "PERF",  # Perflint
    "RUF",   # ruff itself
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle
]
ignore = [
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "RUF012",  # mutable-class-default
    "SIM108",  # if-else-block-instead-of-if-exp
]
dummy-variable-rgx = "^_.*"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # Allow use of assert in tests
    "S311",  # Allow use of random in tests
    "S105",  # Allow use of hardcoded password to "password"
    "S106",  # Allow use of hardcoded password in tests
    "S104",  # Allow binding to all interfaces in tests
    "S603",  # Allow subprocess calls in tests (e.g. docker compose)
    "S607",  # Allow starting a process with a partial executable path in tests
]
"sync_ntc_commands.py" = [
    "S108",  # Probably insecure usage of temp file/directory - this is a script
    "S603",  # Use of subprocess without shell=True - this is a script
    "S607",  # Starting a process with a partial executable path - this is a script
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.bandit]
exclude_dirs = ["./tests/", "./.venv", "./docs/", "./sync_ntc_commands.py"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]


[tool.ty.src]
# Phase 3 (#251) complete: the whole tree is ty-clean and scanned with no
# exclusions. The former exclusions were lifted in this order:
#   - Phase 1 (#216) had excluded ssh_server_paramiko (paramiko is untyped and
#     types-paramiko v4 was incompatible with paramiko 5.0); the production file
#     is now ty-clean without stubs, so the entry was dropped.
#   - Phase 2 (#218) had excluded tests/ (MagicMock dynamic attributes and
#     function-state fixtures defeated static analysis); tests/ was brought to
#     0 diagnostics (cast/assert narrowing + localized `# ty: ignore` for
#     intentional type-violation cases) and the entry was dropped.
# Keep exclude empty so any new file is gated by default. ty's own defaults
# still skip .venv and build artifacts.
exclude = []


[tool.coverage.run]
branch = true
omit = [".*", ".venv"]
command_line = "-m pytest"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --dist loadgroup: behaves like the default `load` scheduling, except tests
# sharing an `xdist_group` mark run on one worker (hot-reload fs tests, #232).
addopts = "-vv -n auto --dist loadgroup -m 'not compatibility'"
# Suite-wide safety net (#233): a hung loop/SSH test fails in 5 minutes
# instead of sitting silent until the CI job timeout. Per-test
# `@pytest.mark.timeout(...)` marks override this — tighter pins (30/60/200)
# for loop-risk tests, looser margins (600) for the all-commands sweeps and
# docker tests. The timeout method is left unset on purpose: POSIX uses
# `signal` (the worker survives the failure), Windows falls back to `thread`.
timeout = 300
markers = [
    "compatibility: requires the `compatibility` dep group (netmiko/scrapli/ansible-core) and is run only via the compatibility CI workflow",
    "xdist_group: serialize tests sharing external state onto one xdist worker (pytest-xdist marker, honored via --dist loadgroup; hot-reload fs tests, #232)",
]

[tool.uv.build-backend]
module-name = "simnos"
module-root = ""

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.4", # Linter
    "ruamel-yaml", # YAML parser
    "ty>=0.0.1a26", # Type checkers
    "pytest", # Testing framework
    "pytest-timeout", # Pytest: Timeout tests
    "pytest-xdist>=3.8.0", # Pytest: Parallel test execution
    "pytest-rerunfailures", # Pytest: Retry flaky tests (@pytest.mark.flaky)
    "bandit",
    "coverage",
    "invoke",
    "pre-commit>=3.8.0,<4.0.0",
    "netmiko",
    "requests",
    "mkdocstrings[crystal,python]",
    "mkdocs-material",
    "mkdocs-static-i18n",
    "pymdown-extensions",
    "yamllint", # YAML linter
]
compatibility = [
    # netmiko is already in `dev` (default group), so not repeated here
    "scrapli",          # scrapli interop test
    "ansible-core",     # ansible interop test (cli_command / ios_facts)
    "ansible-pylibssh", # ansible libssh backend — required against the asyncssh
                        # transport (paramiko backend trips the auth-retry
                        # disconnect, #297 Stage 2 テーマE / E2)
]
