---
# Synthetic external custom platform (A3 dir + handler py) — the test SSoT for
# an out-of-package platform. Consumed by the custom-platform e2e
# (tests/plugins/test_custom_platform_e2e.py, registry-injected) and as the
# cmd_shell test fixture platform (tests/plugins/test_cmd_shell.py).
# Prompts mirror cisco_ios so a netmiko `cisco_ios` driver can connect and
# drive it (`terminal length 0` / `terminal width 511` answer netmiko's
# session prep). NOT a shipped platform.
modes:
  user:
    prompt: "{{ base_prompt }}>"
  enable:
    prompt: "{{ base_prompt }}#"
  config:
    prompt: "{{ base_prompt }}(config)#"
initial_mode: user
