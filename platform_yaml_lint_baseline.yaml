# Platform yaml lint baseline (#244) — frozen drift, ratchet-only.
#
# Consumed by `invoke lint-platform-yaml` (tasks.py:check_platform_yaml).
# Keys are repo-root relative paths. This file only ever SHRINKS:
#   - missing_default: files allowed to lack a `_default_` command.
#     New platform files must define one (vendor-accurate wording, see
#     docs/development/creating_nos_plugin.md).
#   - stub_help: per file, the commands frozen with an auto-generated
#     stub help. Adding a stub to a new command fails CI; replacing a
#     stub with real help requires removing the entry here (the lint
#     fails on stale entries in both directions).
# Regenerate-from-scratch is intentionally NOT provided: the whole point
# is that the frozen set never grows back.
