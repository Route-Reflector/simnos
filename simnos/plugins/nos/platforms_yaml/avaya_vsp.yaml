name: avaya_vsp
initial_prompt: "{base_prompt}>"
enable_prompt: "{base_prompt}#"
config_prompt: "{base_prompt}(config)#"
commands:
  enable:
    output: null
    new_prompt: "{base_prompt}#"
    help: enter enable mode
    prompt: "{base_prompt}>"
  show software:
    output: "\n====================================================================================================\n\
      \                    software releases in /intflash/release/\n====================================================================================================\n\
      \ VOSS8K.4.2.2.0.GA (Backup Release)\nVOSS8K.6.0.1.2.GA (Primary Release)\n\n\
      \ ----------------------------------------------------------------------------------------------------\n\
      \ Auto Commit     : enabled\nCommit Timeout  : 10 minutes\n"
    help: execute the command "show software"
    prompt:
    - "{base_prompt}>"
    - "{base_prompt}#"
  terminal more disable:
    output: null
    help: Execute the command terminal more disable. This automatically generated.
    prompt:
    - "{base_prompt}>"
    - "{base_prompt}#"
  # source: https://shrubbery.net/pipermail/rancid-discuss/2023-April/011289.html (retrieved 2026-06-07)
  #   note: one real-device capture covering both VSP and ERS in the same
  #   thread (shared with avaya_ers); not two independent captures.
  _default_:
    output: "% Invalid input detected at '^' marker."
    help: default output for unknown commands
