# NTC fixture-derived `output` and `output_variants` are preventively escaped
# via sync_ntc_commands.escape_format_braces: literal `{` / `}` are doubled
# (`{{` / `}}`) so the runtime `.format(base_prompt=...)` collapses them back
# to single braces. Lone `}}` runs in encrypted strings are intentional.
name: huawei_smartax
initial_prompt: "{base_prompt}>"
enable_prompt: "{base_prompt}#"
config_prompt: "{base_prompt}(config)#"
commands:
  enable:
    output: null
    new_prompt: "{base_prompt}#"
    help: enter enable mode
    prompt: "{base_prompt}>"
  undo smart:
    output: null
    help: undo the command completion mode (smart mode)
    prompt:
    - "{base_prompt}>"
    - "{base_prompt}#"
  scroll:
    output: null
    help: disables the paging so the output is complete always
    prompt:
    - "{base_prompt}>"
    - "{base_prompt}#"
