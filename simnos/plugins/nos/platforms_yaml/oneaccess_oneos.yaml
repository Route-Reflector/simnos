name: oneaccess_oneos
initial_prompt: '{base_prompt}>'
enable_prompt: '{base_prompt}#'
config_prompt: '{base_prompt}(config)#'
commands:
  enable:
    output: null
    new_prompt: '{base_prompt}#'
    help: enter enable mode
    prompt: '{base_prompt}>'
  term len 0:
    output: ''
    help: disable paging
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
  screen-width 512:
    output: 'error: unknown command'
    help: set terminal width (ONEOS6, returns error to trigger ONEOS5 fallback)
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
  stty columns 255:
    output: ''
    help: set terminal width (ONEOS5 fallback)
    prompt:
    - '{base_prompt}>'
    - '{base_prompt}#'
  cat bsa bsaboot.inf:
    output: 'flash:/BSA/binaries/OneOs

      flash:/BSA/config/bsaStart.cfg

      '
